<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muamal Ahmed | البطاقة التعريفية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }
        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            margin: 0 auto 20px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #38bdf8;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            background-color: #334155;
            color: #f8fafc;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">MA</div>
        <h1>Muamal Ahmed</h1>
        <div class="subtitle">Electrical Engineering</div>
        <p>مرحباً بك في موقعي الشخصي! مهندس كهرباء أعمل على مشاريع المحاكاة والتطوير التقني.</p>
        
        <div class="links">
            <a href="https://github.com/amwml1247-byte" target="_blank" class="btn">معرض المشاريع على GitHub</a>
            <a href="#" class="btn">تواصل معي عبر تلغرام</a>
        </div>
    </div>
</body>
</html>
